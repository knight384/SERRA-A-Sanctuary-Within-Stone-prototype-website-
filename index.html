    <title>SERRA — A Sanctuary Within Stone</title>

  <body class="bg-[#100d0a] text-[#fffdf8] font-sans antialiased overflow-x-hidden selection:bg-[#d9a588] selection:text-[#23180f]">
    <div id="root">
      <noscript>
        <main style="max-width: 800px; margin: 0 auto; padding: 48px 24px; font-family: 'Inter', sans-serif; background-color: #100d0a; color: #fffdf8;">
          <header style="margin-bottom: 64px;">
            <p style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #d6c8bc; margin-bottom: 8px;">A SANCTUARY WITHIN STONE</p>
            <h1 style="font-size: 36px; letter-spacing: 0.18em; font-weight: 450; margin: 0;">SERRA</h1>
          </header>

          <section id="the-place" style="margin-bottom: 72px;">
            <p style="font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #ab826b; margin-bottom: 12px;">01 — THE ARRIVAL</p>
            <h2 style="font-size: 48px; line-height: 1.05; font-weight: 400; margin: 0 0 8px 0;">Somewhere beyond.</h2>
            <p style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 54px; line-height: 1; margin: 0 0 24px 0; color: #fffdf8;">Closer to yourself.</p>
            <p style="font-size: 18px; line-height: 1.5; color: #d6c8bc; max-width: 480px;">A secluded desert retreat shaped by sandstone, silence, and light. Space to slow down. Room to simply be.</p>
          </section>

          <section id="the-stay" style="margin-bottom: 72px;">
            <p style="font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #ab826b; margin-bottom: 12px;">02 — INTO THE LANDSCAPE</p>
            <h2 style="font-size: 48px; line-height: 1.05; font-weight: 400; margin: 0 0 8px 0;">Carved by time.</h2>
            <p style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 54px; line-height: 1; margin: 0 0 24px 0; color: #fffdf8;">Made for stillness.</p>
            <p style="font-size: 18px; line-height: 1.5; color: #d6c8bc; max-width: 480px;">Follow the canyon inward to private stone suites, quiet pools, and open skies. Every detail belongs to the landscape.</p>
          </section>

          <section id="experiences" style="margin-bottom: 72px;">
            <p style="font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #ab826b; margin-bottom: 12px;">03 — BEYOND THE EXPECTED</p>
            <h2 style="font-size: 48px; line-height: 1.05; font-weight: 400; margin: 0 0 8px 0;">A little further.</h2>
            <p style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 54px; line-height: 1; margin: 0 0 24px 0; color: #fffdf8;">A little quieter.</p>
            <p style="font-size: 18px; line-height: 1.5; color: #d6c8bc; max-width: 480px;">Beyond the water, the sanctuary unfolds. Follow the light into private spaces, warm stone, and a quieter kind of luxury.</p>
          </section>

          <section id="the-cards" style="margin-bottom: 72px; display: grid; gap: 24px;">
            <div style="background: #342a23; padding: 28px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);">
              <p style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #d9a588; margin-bottom: 8px;">THE STAY</p>
              <h3 style="font-size: 24px; font-weight: 400; margin: 0 0 12px 0;">Stay within stone</h3>
              <p style="font-size: 16px; line-height: 1.45; color: #d6c8bc; margin: 0;">Private canyon suites, natural textures, and terraces opening onto the quiet of the desert.</p>
            </div>
            <div style="background: #342a23; padding: 28px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);">
              <p style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #d9a588; margin-bottom: 8px;">THE EXPERIENCE</p>
              <h3 style="font-size: 24px; font-weight: 400; margin: 0 0 12px 0;">Find your rhythm</h3>
              <p style="font-size: 16px; line-height: 1.45; color: #d6c8bc; margin: 0;">Sunrise walks, mineral bathing, and dinners beneath an uninterrupted sky.</p>
            </div>
          </section>

          <section id="the-horizon" style="margin-bottom: 72px;">
            <p style="font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #ab826b; margin-bottom: 12px;">04 — ROOM TO BREATHE</p>
            <h2 style="font-size: 48px; line-height: 1.05; font-weight: 400; margin: 0 0 8px 0;">A world apart.</h2>
            <p style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 54px; line-height: 1; margin: 0 0 24px 0; color: #fffdf8;">A place within.</p>
            <p style="font-size: 18px; line-height: 1.5; color: #d6c8bc; max-width: 480px;">The canyon opens. The horizon stretches. An intimate sanctuary, and a slower way to see the world.</p>
          </section>
        </main>
      </noscript>
    </div>
